<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — AllStar Painting &amp; Drywall</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { --brand-blue:#0c3ba5; --brand-red:#c32c38; --text:#222; --muted:#666; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',system-ui,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.5}
  header{background:var(--brand-blue);color:#fff;padding:18px 24px;text-align:center}
  header a{color:#fff;text-decoration:none;font-weight:600;letter-spacing:.5px}
  main{max-width:680px;margin:0 auto;padding:80px 24px 120px;text-align:center}
  h1{font-size:42px;color:var(--brand-blue);margin:0 0 16px;line-height:1.2}
  .accent{display:inline-block;width:80px;height:3px;background:var(--brand-red);margin:0 auto 28px}
  p{font-size:17px;color:var(--muted);margin:0 0 12px}
  .cta{display:inline-block;margin-top:32px;padding:14px 36px;background:var(--brand-blue);color:#fff;text-transform:uppercase;font-weight:600;letter-spacing:1px;font-size:14px;text-decoration:none;border-radius:0;transition:background .2s}
  .cta:hover{background:var(--brand-red)}
  .phone{margin-top:48px;font-size:15px;color:#444}
  .phone a{color:var(--brand-blue);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header><a href="/">AllStar Painting &amp; Drywall</a></header>
<main>
  <h1>Thanks — we got your message.</h1>
  <span class="accent"></span>
  <p>One of our painters will reach out within one business day to follow up on your request.</p>
  <p>If you need to talk sooner, give us a call.</p>
  <a class="cta" href="/">Back to home</a>
  <div class="phone">Or call <a href="tel:3187298447">(318) 729-8447</a></div>
</main>
</body>
</html>
